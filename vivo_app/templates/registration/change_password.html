{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password - VIVO{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        <h1>Change Password</h1>
        
        <form method="post" class="mt-4">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-actions mt-4">
                <button type="submit" class="btn btn-primary">
                    Change Password
                </button>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary ml-2">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
