{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-form">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        
        {% block auth_content %}{% endblock %}
    </div>
</div>
{% endblock %}
